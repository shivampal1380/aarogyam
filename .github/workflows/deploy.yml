name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # NOTE: These are VITE_* (client-side) vars that get embedded in the
      # public JS bundle, so they are not secret. They must match the values
      # in client/.env so the deployed site behaves identically.
      VITE_GOOGLE_SHEETS_URL: "https://script.google.com/macros/s/AKfycbyW891JG5YerU-0f3s3o-a-jXKG-4GGOcusqXRMkVqaSg5sgCeZIxWr58yVneDaZu6SmA/exec"
      VITE_RAZORPAY_PAYMENT_URL: "https://pages.razorpay.com/pl_TDkjJ5JipKcrxH/view"
      VITE_WHATSAPP_NUMBER: "919870003571"
      VITE_WHATSAPP_MESSAGE: "Hello Aarogyam Wellness Centre, I have successfully registered for the workshop. Thank You."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
